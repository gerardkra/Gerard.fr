<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CV indisponible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      background: var(--bg, #0b1220);
      color: var(--text, #ffffff);
    }

    .container {
      text-align: center;
      max-width: 400px;
      padding: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.7;
      margin-bottom: 1.5rem;
    }

    a {
      text-decoration: none;
      border: 1px solid currentColor;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: 0.2s;
    }

    a:hover {
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📄 CV indisponible</h1>
    <p>En cours de mise à jour. Il sera bientôt disponible.</p>
    <a href="index.html">Retour</a>
  </div>
</body>
</html>
