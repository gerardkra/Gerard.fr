<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Cours Epitech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;

      
      background: radial-gradient(circle at top, #0f1c3f, #020617);
      color: #ffffff;
    }

    .container {
      text-align: center;
      max-width: 420px;
      padding: 2.5rem;

      
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    
    h1::after {
      content: "";
      display: block;
      width: 50px;
      height: 3px;
      margin: 10px auto 0;
      background: #6366f1;
      border-radius: 2px;
    }

    p {
      opacity: 0.65;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
    }

    a {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 10px;

      color: #fff;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);

      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;

      transition: 0.2s;
    }

    a:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>💻 Page indisponible</h1>
    <p>En cours de mise à jour. Elle sera bientôt disponible. Merci de votre patience.</p>
    <a href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
